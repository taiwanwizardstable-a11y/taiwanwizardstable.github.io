      object-fit: contain;

<!-- =====================================
     將分數寫入原本計分器
===================================== -->

<script>
  document.querySelectorAll(
    ".house-card[data-house]"
  ).forEach(function(card) {

    const house = card.dataset.house;

    if (
      Object.prototype.hasOwnProperty.call(
        HOUSE_SCORES,
        house
      )
    ) {
      card.dataset.score = HOUSE_SCORES[house];
    }

  });
</script>

<!-- 原本的寶石積分動畫 -->
<script src="house-cup.js"></script>

<!-- =====================================
     冠軍盾牌淡入動畫
===================================== -->

<script>
document.addEventListener("DOMContentLoaded", function() {

  const champions = document.querySelectorAll(
    ".champion-entry"
  );

  if (
    window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches
  ) {
    champions.forEach(function(champion) {
      champion.classList.add("is-visible");
    });
    return;
  }

  if (!("IntersectionObserver" in window)) {
    champions.forEach(function(champion) {
      champion.classList.add("is-visible");
    });
    return;
  }

  const observer = new IntersectionObserver(
    function(entries) {

      entries.forEach(function(entry) {

        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        }

      });

    },
    {
      threshold: 0.12
    }
  );

  champions.forEach(function(champion) {
    observer.observe(champion);
  });

});
</script>
