  <style>

    /* ======================================
       HALL OF CHAMPIONS
       歷屆學院冠軍
    ====================================== */

    .champions-section {
      width: 100%;
      max-width: 1100px;
      margin: 110px auto 90px;
      padding: 0 20px;
      box-sizing: border-box;
      text-align: center;
    }

    /* 金色分隔線 */

    .champions-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 70px;
    }

    .champions-divider::before,
    .champions-divider::after {
      content: "";
      width: 160px;
      max-width: 28%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(184, 148, 92, 0.7),
        transparent
      );
    }

    .champions-divider span {
      color: #b8945c;
      font-size: 20px;
    }

    /* 標題 */

    .champions-small-title {
      font-family: "Cinzel", Georgia, serif;
      color: #b8945c;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin: 0 0 24px;
    }

    .champions-title {
      font-family: "Cinzel", Georgia, serif;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 400;
      letter-spacing: 3px;
      color: #e2cba5;
      line-height: 1.3;
      margin: 0;
    }

    .champions-subtitle {
      font-family: "Noto Serif TC", serif;
      color: #b39a74;
      font-size: 15px;
      letter-spacing: 5px;
      margin: 22px 0 0;
    }

    /* 冠軍展示 */

    .champions-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 60px;
      margin-top: 60px;
    }

    .champion-entry {
      width: 100%;
      max-width: 390px;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      transition:
        opacity 1.1s ease,
        transform 1.1s ease;
    }

    .champion-entry.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* 冠軍盾牌 */

    .champion-plaque-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .champion-plaque {
      display: block;
      width: 100%;
      max-width: 350px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(
        0 16px 25px rgba(0, 0, 0, 0.65)
      );
      transition:
        transform 0.6s ease,
        filter 0.6s ease;
    }

    .champion-entry:hover .champion-plaque {
      transform: translateY(-7px) scale(1.025);
      filter:
        drop-shadow(0 18px 28px rgba(0, 0, 0, 0.7))
        drop-shadow(0 0 15px rgba(184, 148, 92, 0.2));
    }

    /* 學院名稱 */

    .champion-house-name {
      font-family: "Cinzel", Georgia, serif;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: 4px;
      color: #d8bf96;
      margin: 25px 0 12px;
      text-transform: uppercase;
    }

    /* 年份 */

    .champion-year {
      font-family: "Cinzel", Georgia, serif;
      color: #a78d69;
      font-size: 12px;
      letter-spacing: 3px;
      line-height: 1.9;
      margin: 0;
    }

    .champion-ornament {
      color: #987b51;
      font-size: 17px;
      margin-top: 30px;
      opacity: 0.8;
    }

    /* 手機版 */

    @media (max-width: 768px) {

      .champions-section {
        margin: 75px auto 65px;
        padding: 0 15px;
      }

      .champions-divider {
        margin-bottom: 50px;
      }

      .champions-small-title {
        font-size: 10px;
        letter-spacing: 4px;
      }

      .champions-title {
        font-size: clamp(28px, 7vw, 40px);
        letter-spacing: 1px;
      }

      .champions-subtitle {
        font-size: 13px;
        letter-spacing: 3px;
      }

      .champions-gallery {
        margin-top: 45px;
        gap: 45px;
      }

      .champion-entry {
        max-width: 320px;
      }

      .champion-plaque {
        max-width: 290px;
      }

      .champion-house-name {
        font-size: 22px;
      }

      .champion-year {
        font-size: 11px;
      }

    }

    /* 無障礙：減少動態 */

    @media (prefers-reduced-motion: reduce) {

      .champion-entry {
        opacity: 1;
        transform: none;
        transition: none;
      }

      .champion-plaque {
        transition: none;
      }

    }

  </style>

<!-- ======================================
     冠軍盾牌淡入動畫
====================================== -->

<script>

document.addEventListener("DOMContentLoaded", function() {

  const champions = document.querySelectorAll(
    ".champion-entry"
  );

  if (!("IntersectionObserver" in window)) {

    champions.forEach(function(champion) {
      champion.classList.add("is-visible");
    });

    return;
  }

  const observer = new IntersectionObserver(

    function(entries) {

      entries.forEach(function(entry) {

        if (entry.isIntersecting) {

          entry.target.classList.add("is-visible");

          observer.unobserve(entry.target);

        }

      });

    },

    {
      threshold: 0.12
    }

  );

  champions.forEach(function(champion) {
    observer.observe(champion);
  });

});

</script>
